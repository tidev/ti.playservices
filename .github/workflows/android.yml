name: Android Build
on:
  push:
    paths-ignore:
    - 'ios/**'
    - 'apidoc/**'
  pull_request:
    paths-ignore:
    - 'ios/**'
    - 'apidoc/**'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    name: Android
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: 1
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'

    - uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '24'

    - name: Cache Node.js modules
      id: node-cache
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.OS }}-node-modules-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.OS }}-node-modules-
          ${{ runner.OS }}-

    - run: npm ci
      name: Install dependencies
      if: steps.node-cache.outputs.cache-hit != 'true'

    - name: Cache Gradle packages
      uses: actions/cache@v6
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - run: npm run lint:android
      name: Lint

    - run: npm i -g titanium
      name: Install Titanium CLI

    - run: ti sdk install 13.4.1.GA
      name: Install Titanium SDK

    - name: Install ccache
      run: sudo apt-get update && sudo apt-get install -y ccache

    - name: Retrieve ccache
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - run: ti build -p android -b -d android --sdk 13.4.1.GA
      name: Build module

    # - name: Build and Test
    #   uses: reactivecircus/android-emulator-runner@v2
    #   env:
    #     ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 120
    #   with:
    #     api-level: 29
    #     target: playstore
    #     script: npm run test:android -- --sdkVersion 12.8.0.GA
    #     emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
    #     disable-animations: true

    - name: Show summary of ccache configuration and statistics counters
      run: ccache --show-stats

# TODO: Grab the version so zip file name can contain it

    - name: Archive Android zip
      uses: actions/upload-artifact@v4
      with:
        name: ti.playservices-android
        path: |
          android/dist/ti.playservices-android-*.zip

    - name: Cleanup Gradle Cache
      # Remove some files from the Gradle cache, so they aren't cached by GitHub Actions.
      # Restoring these files from a GitHub Actions cache might cause problems for future builds.
      run: |
        rm -f ~/.gradle/caches/modules-2/modules-2.lock
        rm -f ~/.gradle/caches/modules-2/gc.properties
